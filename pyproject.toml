[project]
name = "ai-alchemist"
version = "0.1.0"
description = "AI Alchemist — Transform ideas into intelligence. A read-only terminal assistant for local repository inspection."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AI Alchemist Contributors" }]
keywords = ["cli", "git", "ollama", "developer-tools", "privacy", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = [
  "GitPython>=3.1.43",
  "pydantic>=2.6",
  "rich>=13.7",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
ai-alchemist = "phantomos.cli:app"
phantomos = "phantomos.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phantomos"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["phantomos", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
