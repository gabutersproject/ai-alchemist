[project]
name = "ai-alchemist"
version = "0.2.0"
description = "AI Alchemist — Turn open models into intelligent creations. A local laboratory for open-weight models."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AI Alchemist Contributors" }]
keywords = ["ai", "ollama", "open-source", "laboratory", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.6",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
ai-alchemist = "ai_alchemist.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_alchemist"]

[tool.hatch.build.targets.wheel.force-include]
"src/ai_alchemist/web/index.html" = "ai_alchemist/web/index.html"
"src/ai_alchemist/web/styles.css" = "ai_alchemist/web/styles.css"
"src/ai_alchemist/web/app.js" = "ai_alchemist/web/app.js"
"src/ai_alchemist/web/mark.svg" = "ai_alchemist/web/mark.svg"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["ai_alchemist", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
